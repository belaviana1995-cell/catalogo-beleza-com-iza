<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área da proprietária | Beleza com a Iza</title><link rel="stylesheet" href="styles.css"><style>main{max-width:680px;padding:46px 0 70px}.admin-card{background:#fff;border:1px solid var(--line);padding:25px;border-radius:8px}.admin-card form{display:grid;gap:12px}.admin-card label{display:grid;gap:6px;font-size:13px;font-weight:700}.admin-card input,.admin-card select{font:inherit;padding:10px;border:1px solid #cdbbd3;border-radius:4px}.status-message{color:var(--muted);min-height:24px}.hidden{display:none}</style></head><body><header class="hero"><div class="wrap nav"><a class="brand" href="index.html"><img src="logo-beleza-com-a-iza.jpeg" alt="Beleza com a Iza"><span>Beleza com a Iza</span></a></div></header><main class="wrap"><p class="eyebrow">Acesso restrito</p><h1>Administração</h1><section class="admin-card"><p id="setupNote" class="status-message">Configurando acesso seguro…</p><form id="loginForm" class="hidden"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="checkout-button">Entrar</button></form><section id="adminPanel" class="hidden"><p>Conectada como <b id="who"></b></p><form id="productForm"><label>Nome do perfume<input id="name" required maxlength="120"></label><label>Marca<select id="brand"><option>WePink</option><option>Árabes</option><option>O Boticário</option></select></label><label>Preço em reais<input id="price" type="number" min="0" step="0.01" required></label><label>URL da imagem<input id="image" type="url"></label><label><input id="available" type="checkbox" checked> Disponível</label><label><input id="featured" type="checkbox"> Destacar no catálogo</label><button class="checkout-button">Salvar perfume</button></form><p class="status-message" id="saveStatus"></p><button id="logout" class="tab">Sair</button></section></section></main><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
